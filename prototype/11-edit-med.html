<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>if (new URLSearchParams(location.search).get('embed') === '1') { document.documentElement.classList.add('embedded'); }</script>
<title>新增／編輯次數 | Ahok - 年長者的生活管家</title>
<link rel="icon" type="image/png" href="../img/favicon.png?v=2">
<link rel="stylesheet" href="styles.css">
<script src="demo-nav.js" defer></script>
</head>
<body class="page-backdrop track-caregiver">

<div class="phone-frame">
  <div class="phone-frame__island"></div>
  <div class="phone-frame__screen">

<div class="screen screen--family">

  <header class="topbar topbar--compact">
    <a href="10-manage-meds.html" class="topbar__icon topbar__icon--interactive" style="text-decoration:none;" aria-label="返回吃藥管理">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 5l-7 7 7 7"/>
      </svg>
    </a>
    <div class="topbar__text">
      <span class="topbar__greeting" data-form-title>編輯次數</span>
      <span class="topbar__date">填好之後陳奶奶的提醒會自動更新</span>
    </div>
  </header>

  <main class="content">

    <form class="stack stack--roomy" onsubmit="return false;">

      <div class="field">
        <label for="med-name">藥物名稱／說法</label>
        <input type="text" id="med-name" name="med-name" data-form-field="name" value="早餐後的藥" placeholder="例如：早餐後的藥">
      </div>

      <div class="field">
        <label for="med-count">顆數</label>
        <input type="number" id="med-count" name="med-count" data-form-field="count" value="3" min="1" max="20">
      </div>

      <div class="field">
        <label for="med-time">提醒時間</label>
        <input type="time" id="med-time" name="med-time" data-form-field="time" value="08:00">
      </div>

      <div class="field">
        <label for="med-caption">用途說明（選填，白話一句話就好，會顯示在提醒卡片上）</label>
        <input type="text" id="med-caption" name="med-caption" data-form-field="caption" value="顧心臟、顧血壓的藥" placeholder="例如：顧心臟的藥">
      </div>

      <div class="field">
        <label for="med-note">服用備註（會顯示在提醒卡片上）</label>
        <textarea id="med-note" name="med-note" data-form-field="note" placeholder="例如：飯後配溫水吃，記得坐著慢慢吃就好，不用急。">飯後配溫水吃，記得坐著慢慢吃就好，不用急。</textarea>
      </div>

      <div class="field">
        <label id="med-accent-label">辨識顏色（選填，跟家裡藥盒的顏色對應就好）</label>
        <div class="accent-picker" role="radiogroup" aria-labelledby="med-accent-label">
          <button type="button" class="accent-swatch accent-swatch--yellow is-selected" aria-pressed="true" aria-label="黃色"></button>
          <button type="button" class="accent-swatch accent-swatch--blue" aria-pressed="false" aria-label="藍色"></button>
          <button type="button" class="accent-swatch accent-swatch--red" aria-pressed="false" aria-label="紅色"></button>
          <button type="button" class="accent-swatch accent-swatch--green" aria-pressed="false" aria-label="綠色"></button>
          <button type="button" class="accent-swatch accent-swatch--purple" aria-pressed="false" aria-label="紫色"></button>
          <button type="button" class="accent-swatch accent-swatch--orange" aria-pressed="false" aria-label="橘色"></button>
          <button type="button" class="accent-swatch accent-swatch--none" aria-pressed="false" aria-label="不設定顏色">無</button>
        </div>
      </div>

      <div class="stack" style="margin-top:auto; gap:var(--space-2);">
        <button type="button" class="btn btn--dark" onclick="location.href='10-manage-meds.html'">
          儲存
        </button>

        <a class="danger-link" href="10-manage-meds.html" data-form-delete>
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/>
          </svg>
          刪除這筆用藥
        </a>
      </div>

    </form>

  </main>

  <nav class="bottom-nav">
    <a class="bottom-nav__item" href="05-family-overview.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 11.5L12 4l8 7.5"/>
        <path d="M6 10v9.5a1 1 0 001 1h10a1 1 0 001-1V10"/>
      </svg>
      今日總結
    </a>
    <a class="bottom-nav__item" href="10-manage-meds.html" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.5 20.5L20.5 10.5a5.5 5.5 0 10-7.78-7.78L2.72 12.72a5.5 5.5 0 107.78 7.78z"/>
        <path d="M8.5 8.5l7 7"/>
      </svg>
      吃藥管理
    </a>
    <a class="bottom-nav__item" href="12-edit-appointment.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.5" y="5" width="17" height="15" rx="2"/>
        <path d="M3.5 9.5h17"/>
        <path d="M8 3v4M16 3v4"/>
      </svg>
      回診管理
    </a>
    <a class="bottom-nav__item" href="09-family-settings.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
      </svg>
      管理設定
    </a>
  </nav>

</div>

  </div>
</div>

<nav class="demo-nav" aria-label="Demo 導覽（僅供展示用，非產品內容）">
  <button type="button" class="demo-nav__toggle" aria-label="展示導覽選單" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
  </button>
  <div class="demo-nav__panel">
    <p class="demo-nav__title">Demo 導覽</p>
    <p class="demo-nav__group-label">長輩端</p>
    <a class="demo-nav__link" href="01-today.html">每日提醒</a>
    <a class="demo-nav__link" href="02-confirmed.html">已完成確認</a>
    <a class="demo-nav__link" href="03-medlist.html">今天的藥</a>
    <a class="demo-nav__link" href="08-voice-settings.html">語音設定</a>
    <p class="demo-nav__group-label">家屬端</p>
    <a class="demo-nav__link" href="10-manage-meds.html">吃藥管理</a>
    <a class="demo-nav__link" href="11-edit-med.html" aria-current="page">新增／編輯次數</a>
  </div>
</nav>

<script>
  (function () {
    Array.prototype.slice.call(document.querySelectorAll('.accent-swatch')).forEach(function (btn) {
      btn.addEventListener('click', function () {
        Array.prototype.slice.call(document.querySelectorAll('.accent-swatch')).forEach(function (b) {
          b.classList.remove('is-selected');
          b.setAttribute('aria-pressed', 'false');
        });
        btn.classList.add('is-selected');
        btn.setAttribute('aria-pressed', 'true');
      });
    });

    var params = new URLSearchParams(location.search);
    var isAdd = params.get('mode') === 'add';
    if (isAdd) {
      document.querySelector('[data-form-title]').textContent = '新增次數';
      document.getElementById('med-name').value = '';
      document.getElementById('med-count').value = '';
      document.getElementById('med-time').value = '';
      document.getElementById('med-note').value = '';
      document.getElementById('med-caption').value = '';
      document.getElementById('med-name').placeholder = '例如：睡前的藥';
      Array.prototype.slice.call(document.querySelectorAll('.accent-swatch')).forEach(function (btn) {
        var isNone = btn.classList.contains('accent-swatch--none');
        btn.classList.toggle('is-selected', isNone);
        btn.setAttribute('aria-pressed', isNone ? 'true' : 'false');
      });
      var del = document.querySelector('[data-form-delete]');
      if (del) del.style.display = 'none';
    }
  })();
</script>

</body>
</html>
