  <header class="topbar topbar--compact">
    <a href="09-family-settings.html" class="topbar__icon topbar__icon--interactive" style="text-decoration:none;" aria-label="返回管理設定">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 5l-7 7 7 7"/>
      </svg>
    </a>
    <div class="topbar__text">

      <span class="topbar__date">陳奶奶的基本資料</span>

  <main class="content">

      <div class="field">
        <label for="p-name">姓名</label>
        <input type="text" id="p-name" value="陳奶奶">
      </div>

      <div class="field-row">
        <div class="field">
          <label for="p-age">年齡</label>
          <input type="number" id="p-age" value="72">
        </div>
        <div class="field">
          <label for="p-address">居住地</label>
          <input type="text" id="p-address" value="家中獨居">
        </div>
      </div>

    </form>

    <div class="divider" style="margin: var(--space-2) 0;"></div>

    <p class="card__label" style="margin:0;">緊急聯絡人</p>

    <a class="manage-list-row" href="#">
      <div class="card__icon card__icon--warm">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 5c0-1 .8-2 2-2h2.2c.5 0 .9.3 1 .8l1 3.6c.1.4 0 .9-.3 1.2L8.4 10c1 2.3 2.8 4.1 5.1 5.1l1.4-1.5c.3-.3.8-.4 1.2-.3l3.6 1c.5.1.8.5.8 1V18c0 1.2-1 2-2.2 2C10.8 20 4 13.2 4 5z"/>

        <span class="manage-list-row__title">陳阿明（兒子）</span>
        <span class="manage-list-row__sub">0912-345-678・預設優先聯絡</span>
      </div>
      <span class="manage-list-row__edit" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
      </span>
    </a>

    <a class="manage-list-row" href="#">
      <div class="card__icon card__icon--muted">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 5c0-1 .8-2 2-2h2.2c.5 0 .9.3 1 .8l1 3.6c.1.4 0 .9-.3 1.2L8.4 10c1 2.3 2.8 4.1 5.1 5.1l1.4-1.5c.3-.3.8-.4 1.2-.3l3.6 1c.5.1.8.5.8 1V18c0 1.2-1 2-2.2 2C10.8 20 4 13.2 4 5z"/>

      </div>

        <span class="manage-list-row__title">居家照護中心</span>
        <span class="manage-list-row__sub">02-2345-6789</span>
      </div>
      <span class="manage-list-row__edit" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
      </span>

        <path d="M12 5v14M5 12h14"/>
