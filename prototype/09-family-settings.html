<script>
  document.addEventListener('DOMContentLoaded', function () {
    if (!window.AhokFamilyPhoto) return;
    var preview = document.querySelector('[data-photo-preview]');
    var uploadBtn = document.querySelector('[data-photo-upload]');
    var removeBtn = document.querySelector('[data-photo-remove]');
    var fileInput = document.querySelector('[data-photo-input]');
    var checkIcon = preview.innerHTML;

    function render(photo) {
      preview.innerHTML = photo
        ? '<img src="' + photo + '" alt="家族合照">'
        : checkIcon;
    }

    render(AhokFamilyPhoto.get());

    uploadBtn.addEventListener('click', function () { fileInput.click(); });

    fileInput.addEventListener('change', function () {
      var file = fileInput.files && fileInput.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        AhokFamilyPhoto.set(reader.result);
        render(reader.result);
      };
      reader.readAsDataURL(file);
    });

    removeBtn.addEventListener('click', function () {
      AhokFamilyPhoto.set('');
      render('');
      fileInput.value = '';
    });
  });
</script>
