<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ahok - 年長者的生活管家</title>
<link rel="icon" type="image/png" href="../img/favicon.png?v=2">
<link rel="stylesheet" href="styles.css">
<script src="demo-nav.js" defer></script>
<style>
  body {
    background: var(--color-secondary);
    padding: var(--space-5) var(--space-3);
  }
  .gallery-header {
    max-width: 1400px;
    margin: 0 auto var(--space-5);
    text-align: center;
  }
  .gallery-header h1 {
    font-size: 30px;
    color: var(--color-primary);
    margin: 0 0 8px;
  }
  .gallery-header p {
    font-size: 15px;
    color: var(--color-text-secondary);
    margin: 0;
  }
  .gallery-header img.app-logo {
    width: 72px;
    height: 72px;
    display: block;
    margin: 0 auto 16px;
    border-radius: 18px;
  }
  .gallery-group {
    max-width: 1400px;
    margin: 0 auto var(--space-5);
  }
  .gallery-group h2 {
    font-size: 20px;
    color: var(--color-primary);
    border-bottom: 2px solid rgba(15,76,66,0.15);
    padding-bottom: 8px;
  }
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(390px, 1fr));
    gap: var(--space-4);
  }
  .device-frame {
    background: #FFFFFF;
    border-radius: 28px;
    padding: 10px;
    box-shadow: 0 10px 30px rgba(15,76,66,0.14);
    max-width: 430px;
    margin: 0 auto;
    width: 100%;
  }
  .device-frame iframe {
    width: 100%;
    aspect-ratio: 390 / 844;
    height: auto;
    border: none;
    border-radius: 20px;
    display: block;
    background: var(--color-secondary);
  }
  .device-frame figcaption {
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    color: var(--color-primary);
    padding: 10px 4px 2px;
  }
</style>
</head>
<body>

  <div class="gallery-header">
    <a href="01-today.html">
      <img class="app-logo" src="../img/logo.png" alt="Ahok logo">
    </a>
    <h1>Ahok - 年長者的生活管家</h1>
    <p>Prototype 一覽・去醫療化＋溫暖陪伴・服藥與回診提醒 App</p>
  </div>

  <div class="gallery-group">
    <h2>長輩端</h2>
    <div class="gallery-grid">
      <figure class="device-frame">
        <iframe src="01-today.html?embed=1" title="每日提醒首頁"></iframe>
        <figcaption>1. 每日提醒首頁</figcaption>
      </figure>
      <figure class="device-frame">
        <iframe src="02-confirmed.html?embed=1" title="已完成確認畫面"></iframe>
        <figcaption>2. 已完成／確認回饋畫面</figcaption>
      </figure>
      <figure class="device-frame">
        <iframe src="03-medlist.html?embed=1" title="藥物列表總覽"></iframe>
        <figcaption>3. 藥物列表／一天多次提醒總覽</figcaption>
      </figure>
      <figure class="device-frame">
        <iframe src="04-emergency.html?embed=1" title="緊急聯絡"></iframe>
        <figcaption>4. 緊急聯絡／求助</figcaption>
      </figure>
      <figure class="device-frame">
        <iframe src="07-appointment.html?embed=1" title="回診提醒"></iframe>
        <figcaption>5. 回診提醒</figcaption>
      </figure>
      <figure class="device-frame">
        <iframe src="08-voice-settings.html?embed=1" title="語音設定"></iframe>
        <figcaption>6. 語音設定（中文／台語）</figcaption>
      </figure>
    </div>
  </div>

  <div class="gallery-group">
    <h2>家屬端</h2>
    <div class="gallery-grid">
      <figure class="device-frame">
        <iframe src="05-family-overview.html?embed=1" title="家屬今日總結"></iframe>
        <figcaption>7. 今日總結（家屬視角）</figcaption>
      </figure>
      <figure class="device-frame">
        <iframe src="06-family-notification.html?embed=1" title="未服藥提醒通知詳情"></iframe>
        <figcaption>8. 未服藥提醒／通知詳情</figcaption>
      </figure>
    </div>
  </div>

  <div class="gallery-group">
    <h2>家屬端・管理設定</h2>
    <div class="gallery-grid">
      <figure class="device-frame">
        <iframe src="09-family-settings.html?embed=1" title="管理設定"></iframe>
        <figcaption>9. 管理設定入口</figcaption>
      </figure>
      <figure class="device-frame">
        <iframe src="10-manage-meds.html?embed=1" title="吃藥管理"></iframe>
        <figcaption>10. 吃藥管理列表</figcaption>
      </figure>
      <figure class="device-frame">
        <iframe src="11-edit-med.html?embed=1" title="新增／編輯次數"></iframe>
        <figcaption>11. 新增／編輯次數</figcaption>
      </figure>
      <figure class="device-frame">
        <iframe src="12-edit-appointment.html?embed=1" title="編輯回診"></iframe>
        <figcaption>12. 編輯回診</figcaption>
      </figure>
      <figure class="device-frame">
        <iframe src="13-profile.html?embed=1" title="個人資料設定"></iframe>
        <figcaption>13. 個人資料設定</figcaption>
      </figure>
    </div>
  </div>

  <nav class="demo-nav" aria-label="Demo 導覽（僅供展示用，非產品內容）">
    <button type="button" class="demo-nav__toggle" aria-label="展示導覽選單" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    </button>
    <div class="demo-nav__panel">
      <p class="demo-nav__title">Demo 導覽</p>
      <p class="demo-nav__group-label">長輩端</p>
      <a class="demo-nav__link" href="01-today.html">每日提醒</a>
      <a class="demo-nav__link" href="02-confirmed.html">已完成確認</a>
      <a class="demo-nav__link" href="03-medlist.html">今天的藥</a>
      <a class="demo-nav__link" href="08-voice-settings.html">語音設定</a>
      <p class="demo-nav__group-label">家屬端</p>
      <a class="demo-nav__link" href="10-manage-meds.html">吃藥管理</a>
      <a class="demo-nav__link" href="11-edit-med.html">新增／編輯次數</a>
      <p class="demo-nav__group-label">其他</p>
      <a class="demo-nav__link" href="../briefing.html">簡報</a>
    </div>
  </nav>

</body>
</html>
