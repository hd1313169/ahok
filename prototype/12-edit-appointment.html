<div class="phone-frame">
  <div class="phone-frame__island"></div>

<div class="screen screen--family">

  <header class="topbar topbar--compact">
    <a href="09-family-settings.html" class="topbar__icon topbar__icon--interactive" style="text-decoration:none;" aria-label="返回管理設定">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 5l-7 7 7 7"/>
      </svg>
    </a>
    <div class="topbar__text">
      <span class="topbar__greeting">編輯回診</span>
      <span class="topbar__date">陳奶奶的下次回診資訊</span>
    </div>
  </header>

  <main class="content">

    <form class="stack" onsubmit="return false;">

      <div class="field-row">
        <div class="field">
          <label for="appt-date">日期</label>
          <input type="date" id="appt-date" value="2026-08-21">
        </div>
        <div class="field">
          <label for="appt-time">時間</label>
          <input type="time" id="appt-time" value="09:30">
        </div>
      </div>

      <div class="field">
        <label for="appt-place">院所</label>
        <input type="text" id="appt-place" value="市立醫院" placeholder="例如：市立醫院">
      </div>

      <div class="field">
        <label for="appt-dept">科別</label>
        <input type="text" id="appt-dept" value="心臟內科" placeholder="例如：心臟內科">
      </div>

      <div class="field">
        <label for="appt-note">備註（會顯示在陳奶奶的提醒卡片上）</label>
        <textarea id="appt-note" placeholder="例如：記得帶健保卡、藥袋、上次的檢查單">記得帶：健保卡、藥袋、上次的檢查單。陳阿明會請假陪您一起去。</textarea>
      </div>

      <label class="check-row">
        <input type="checkbox" checked>
        <span class="check-row__body">
          <span class="check-row__title">陳阿明會陪同前往</span>
          <span class="check-row__sub">勾選後，提醒卡片會加上這句安心的話</span>
        </span>
      </label>

      <button type="button" class="btn btn--success" onclick="location.href='09-family-settings.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M8 12.5l2.7 2.7L16 9.8"/>
        </svg>
        儲存
      </button>

    </form>

  </main>

  <nav class="bottom-nav">
