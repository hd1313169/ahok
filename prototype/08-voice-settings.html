<style>
  .voice-option {
    position: absolute;
    opacity: 0;
    width: 1px;
    height: 1px;
  }
  .voice-card-group {
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
    margin-top: auto;
    margin-bottom: auto;
  }
  .voice-card {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    background: var(--color-card);
    border-radius: var(--radius-card);
    padding: var(--space-4);
    min-height: 108px;
    cursor: pointer;
  }
  .voice-card__body {
    flex: 1;
  }
  .voice-card__title {
    font-size: 21px;
    font-weight: 700;
    color: var(--color-text);
  }
  .voice-card__sub {
    font-size: 15px;
    color: var(--color-text-secondary);
    margin-top: 2px;
  }
  .voice-card__check {
    width: 30px;
    height: 30px;
    border-radius: 999px;
    border: 2px solid rgba(69, 117, 105, 0.3);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .voice-card__check svg {
    width: 18px;
    height: 18px;
    stroke: #FFFFFF;
    opacity: 0;
  }
  .voice-option:checked + .voice-card {
    border-color: var(--color-primary);
    background: rgba(69, 117, 105, 0.05);
  }
  .voice-option:checked + .voice-card .voice-card__check {
    background: var(--color-primary);
    border-color: var(--color-primary);
  }
  .voice-option:checked + .voice-card .voice-card__check svg {
    opacity: 1;
  }
  .voice-option:focus-visible + .voice-card {
    outline: 3px solid var(--color-primary);
    outline-offset: 3px;
  }
  .btn--back {
    position: relative;
    min-height: 62px;
    background: rgba(58, 55, 51, 0.08);
    color: var(--color-text-secondary);
    box-shadow: none;
  }
</style>
</head>
