<style>
  .voice-option {
    position: absolute;
    opacity: 0;
    width: 1px;
    height: 1px;
  }
  .voice-card {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    background: var(--color-card);
    border: 2px solid rgba(26, 75, 62, 0.18);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    padding: var(--space-3);
    cursor: pointer;
  }
  .voice-card__icon {
    width: 52px;
    height: 52px;
    flex-shrink: 0;
    border-radius: var(--radius-pill);
    background: rgba(26, 75, 62, 0.08);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .voice-card__icon svg {
    width: 28px;
    height: 28px;
    stroke: var(--color-primary);
  }
  .voice-card__body {
    flex: 1;
  }
  .voice-card__title {
    font-size: 21px;
    font-weight: 700;
    color: var(--color-text);
  }
  .voice-card__sub {
    font-size: 15px;
    color: var(--color-text-secondary);
    margin-top: 2px;
  }
  .voice-card__check {
    width: 30px;
    height: 30px;
    border-radius: 999px;
    border: 2px solid rgba(26, 75, 62, 0.3);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .voice-card__check svg {
    width: 18px;
    height: 18px;
    stroke: #FFFFFF;
    opacity: 0;
  }
  .voice-option:checked + .voice-card {
    border-color: var(--color-primary);
    background: rgba(26, 75, 62, 0.05);
  }
  .voice-option:checked + .voice-card .voice-card__icon {
    background: var(--color-primary);
  }
  .voice-option:checked + .voice-card .voice-card__icon svg {
    stroke: #FFFFFF;
  }
  .voice-option:checked + .voice-card .voice-card__check {
    background: var(--color-primary);
    border-color: var(--color-primary);
  }
  .voice-option:checked + .voice-card .voice-card__check svg {
    opacity: 1;
  }
  .voice-option:focus-visible + .voice-card {
    outline: 3px solid var(--color-primary);
    outline-offset: 3px;
  }
</style>
</head>

<div class="screen">

    </div>

  <main class="content content--balanced">

    <div class="stack">
      <input class="voice-option" type="radio" name="voice" id="voice-zh" checked>
      <label class="voice-card" for="voice-zh">
        <span class="voice-card__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 9v6h4l5 5V4L8 9H4z"/>
            <path d="M16.5 8.5a5 5 0 010 7"/>
          </svg>
        </span>
        <span class="voice-card__body">
          <span class="voice-card__title" style="display:block;">中文語音</span>
          <span class="voice-card__sub" style="display:block;">預設語言，提醒會用中文播放</span>
        </span>
        <span class="voice-card__check">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l5 5L19 7"/></svg>
        </span>
        <button type="button" class="speak-btn speak-btn--compact" aria-label="播放語音範例" data-speak="中文語音，預設語言，提醒會用中文播放。" data-speak-code="08-voice-zh-sample" data-speak-audio-lang="zh">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 9v6h4l5 5V4L8 9H4z"/>
            <path d="M16.5 8.5a5 5 0 010 7"/>
          </svg>
        </button>
      </label>
    </div>

    <div class="stack">
      <input class="voice-option" type="radio" name="voice" id="voice-tw">
      <label class="voice-card" for="voice-tw">
        <span class="voice-card__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 9v6h4l5 5V4L8 9H4z"/>
            <path d="M16.5 8.5a5 5 0 010 7"/>
          </svg>
        </span>
        <span class="voice-card__body">
          <span class="voice-card__title" style="display:block;">台語語音</span>
          <span class="voice-card__sub" style="display:block;">聽中文字覺得吃力時可以切換</span>
        </span>
        <span class="voice-card__check">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l5 5L19 7"/></svg>
        </span>
        <button type="button" class="speak-btn speak-btn--compact" aria-label="播放語音範例" data-speak="台語語音，聽中文字覺得吃力時可以切換。" data-speak-code="08-voice-tw-sample" data-speak-audio-lang="tw">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 9v6h4l5 5V4L8 9H4z"/>
            <path d="M16.5 8.5a5 5 0 010 7"/>
          </svg>
        </button>
      </label>
    </div>

    <div class="card card--has-speak">
      <button type="button" class="speak-btn speak-btn--corner" aria-label="播放語音" data-speak="選好之後，往後的提醒語音都會用這個語言播放，不會自己跳回中文，也不用重新設定。" data-speak-code="08-voice-tip">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9v6h4l5 5V4L8 9H4z"/>
          <path d="M16.5 8.5a5 5 0 010 7"/>
        </svg>
      </button>
      <p class="text-body">選好之後，往後的提醒語音都會用這個語言播放，不會自己跳回中文，也不用重新設定。</p>
    </div>

  </main>
