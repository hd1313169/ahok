<style>
  .confirm-badge {
    width: 128px;
    height: 128px;
    border-radius: 999px;
    background: var(--color-success);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 12px 30px rgba(45, 122, 93, 0.32);
    margin-bottom: var(--space-3);
  }
  .confirm-badge svg {
    width: 68px;
    height: 68px;
    stroke: #FFFFFF;
  }
  .confirm-title {
    font-size: 30px;
    font-weight: 900;
    color: var(--color-success);
    margin: 0 0 var(--space-1);
  }
  .confirm-sub {
    font-size: 19px;
    color: var(--color-text-secondary);
    margin: 0 0 var(--space-4);

</style>

        <div style="text-align:left;">
