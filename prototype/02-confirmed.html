<style>
  .screen--photo-hero {
    padding: 0;
  }
  .photo-hero {
    position: relative;
    flex: 1;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;

  .photo-hero__scrim {

    z-index: 1;
  }
  .photo-hero__content {

    z-index: 2;
    padding: var(--space-4) var(--space-3) var(--space-5);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: var(--space-2);
  }
  .confirm-title {
    font-size: 30px;
    font-weight: 900;
    color: #FFFFFF;
    margin: 0 0 var(--space-1);
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
  }
  .confirm-sub {
    font-size: 19px;
    color: rgba(255, 255, 255, 0.92);
    margin: 0 0 var(--space-3);
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.35);
  }
  .photo-hero__content .btn--ghost {
    color: #FFFFFF;
  }
  .photo-hero__content .btn--ghost svg {
    stroke: #FFFFFF;
  }
  .photo-hero__content .card {
    border: none;
  }
  .photo-hero__content .btn--outline {
    border: none;
  }

  .hero-audio-btn {
    position: absolute;
    top: var(--space-3);
    right: var(--space-3);
    z-index: 3;
    width: 48px;
    height: 48px;
    border: none;
    border-radius: var(--radius-pill);
    background: rgba(0, 0, 0, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    transition: transform 0.12s ease, background 0.15s ease;
  }
  .hero-audio-btn:active {
    transform: scale(0.9);
  }
  .hero-audio-btn svg {
    position: absolute;
    width: 22px;
    height: 22px;
    opacity: 0;
    transition: opacity 0.12s ease;
  }
  .hero-audio-btn .icon-pause {
    opacity: 1;
    fill: #FFFFFF;
  }
  .hero-audio-btn:not(.is-playing) .icon-pause {
    opacity: 0;
  }
  .hero-audio-btn:not(.is-playing) .icon-play {
    opacity: 1;
  }
  .hero-audio-btn.is-playing {
    background: var(--color-primary);
  }

  @keyframes rise-up-fade {
    from {
      opacity: 0;
      transform: translateY(28px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  .photo-hero__content {
    opacity: 0;
    animation: rise-up-fade 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  @media (prefers-reduced-motion: reduce) {
    .photo-hero__content {
      opacity: 1;
      animation: none;
      transform: none;
    }
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var heroPhoto = document.querySelector('[data-hero-photo]');
    if (!heroPhoto || !window.AhokFamilyPhoto) return;
    var photo = AhokFamilyPhoto.get();
    if (photo) {
      heroPhoto.src = photo;
      heroPhoto.hidden = false;
    } else {
      heroPhoto.hidden = true;
    }
  });

  document.addEventListener('DOMContentLoaded', function () {
    var audio = new Audio('../taiwanese_voice/success.mp3');
    var btn = document.querySelector('[data-hero-audio-toggle]');

    function setPlayingState(isPlaying) {
      if (!btn) return;
      btn.classList.toggle('is-playing', isPlaying);
      btn.setAttribute('aria-label', isPlaying ? '停止播放語音' : '播放語音');
    }

    audio.addEventListener('play', function () { setPlayingState(true); });
    audio.addEventListener('pause', function () { setPlayingState(false); });
    audio.addEventListener('ended', function () { setPlayingState(false); });

    setPlayingState(false);

    if (btn) {
      btn.addEventListener('click', function () {
        if (audio.paused) {
          audio.currentTime = 0;
          audio.play().catch(function () {});
        } else {
          audio.pause();
          audio.currentTime = 0;
        }
      });
    }

    // 載入後 1 秒自動播放語音；瀏覽器若封鎖自動播放（需先有使用者互動）
    // 則靜默失敗，長輩仍可用右上角按鈕手動播放
    setTimeout(function () {
      audio.play().catch(function () {});
    }, 1000);
  });
</script>
